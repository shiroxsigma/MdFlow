<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>MdFlow</title>
  <link rel="stylesheet" href="/assets/ui.css">
</head>
<body>
  <div id="topbar">
    <span class="brand">🗺 MdFlow <span id="app-version"></span><small>仕様書・図・ローカルAI</small></span>
    <span class="file-name" id="file-name">samples/login.md</span>
    <span class="spacer"></span>
    <details class="toolbar-menu"><summary>ファイル</summary><div class="toolbar-popover">
      <select id="recent-files" title="最近使ったファイル"><option value="">最近使ったファイル</option></select>
      <label class="autosave"><input id="auto-save" type="checkbox">自動保存</label>
      <button id="btn-open">開く</button><button id="btn-save" class="primary">保存</button>
      <button id="btn-save-as">名前を付けて保存</button><button id="btn-import">PPT取込</button>
    </div></details>
    <details class="toolbar-menu"><summary>図</summary><div class="toolbar-popover wide">
      <label class="ctl">図</label><select id="sel-diagram"></select><label class="ctl">プリセット</label><select id="sel-preset"></select>
      <button id="btn-add-cond">＋条件を登録</button><button id="btn-generate-paths">全経路を自動生成</button><button id="btn-export" class="accent">選択図をPPTへ</button>
    </div></details>
    <button id="btn-llm">✦ AI</button>
    <button id="btn-command" title="コマンドパレット (Ctrl+Shift+P)">⌘</button>
  </div>

  <div id="main">
    <aside id="file-explorer">
      <div class="explorer-head"><span>EXPLORER</span><span class="spacer"></span><button id="btn-open-folder" title="フォルダーを開く">📁</button><button id="btn-refresh-folder" title="更新">↻</button></div>
      <div id="explorer-name">フォルダー未選択</div>
      <div id="explorer-tree"><div class="explorer-empty">📁 を押して作業フォルダーを選択</div></div>
    </aside>
    <div id="left">
      <div class="pane-head">エディタ (Markdown)<span class="spacer"></span><select id="diagram-template"><option value="">図テンプレート</option><option value="sequence">PlantUML sequence</option><option value="class">PlantUML class</option><option value="c4">PlantUML C4</option><option value="mermaid">Mermaid flowchart</option></select><button id="btn-insert-template">挿入</button><span id="cursor-position">Ln 1, Col 1</span></div>
      <div id="editor-area">
        <aside id="outline"><div class="outline-title">OUTLINE</div><div id="outline-items"></div></aside>
        <div id="editor-host">
          <textarea id="editor-fallback" spellcheck="false"></textarea>
        </div>
      </div>
      <div id="cond-strip">
        <div id="route-picker"><label class="ctl">表示経路</label><span id="quick-diagram"></span><div id="preset-buttons"></div></div>
        <details id="condition-advanced"><summary>条件JSONを編集</summary>
          <textarea id="conditions">{"role": "admin", "error_count": 0}</textarea>
        </details>
      </div>
    </div>
    <div id="divider"></div>
    <div id="right">
      <div class="pane-head">プレビュー<span class="spacer"></span>
        <button id="btn-zoom-out" title="縮小">−</button><span id="zoom-label">100%</span><button id="btn-zoom-in" title="拡大">＋</button>
        <select id="export-scale" title="PNG倍率"><option value="1">1x</option><option value="2" selected>2x</option><option value="3">3x</option><option value="4">4x</option></select>
        <button id="btn-copy-svg">SVGコピー</button><button id="btn-copy-png">PNGコピー</button><button id="btn-save-diagram">図を保存</button>
        <button id="btn-export-all">全図ZIP</button><button id="btn-export-ppt-all">全図PPT</button><button id="btn-print-pdf">PDF</button>
      </div>
      <div id="preview" class="md"></div>
    </div>
  </div>

  <div id="statusbar">
    <span id="status-preset" class="badge ok">プリセット: -</span>
    <span id="status-warn"></span>
    <span class="spacer" style="flex:1"></span>
    <span id="status-engine"></span>
  </div>
  <div id="toast"></div>
  <div id="recovery-banner" class="hidden">未保存の編集内容があります。<button id="btn-recover">復元</button><button id="btn-dismiss-recovery">破棄</button></div>
  <div id="command-backdrop" class="hidden"><div id="command-palette"><input id="command-query" placeholder="コマンドを入力..."><div id="command-items"></div></div></div>
  <div id="diagram-context" class="hidden"><button data-command="copy-svg">SVGコピー</button><button data-command="copy-png">PNGコピー</button><button data-command="save-diagram">SVG保存</button><button data-command="export-all">全図ZIP</button></div>

  <div id="llm-backdrop" class="hidden">
    <section id="llm-panel">
      <div class="modal-title">✦ Local LLM <span id="llm-status" class="badge">確認中...</span></div>
      <details id="llm-settings"><summary>接続設定</summary><div class="settings-grid">
        <label class="ctl">接続先</label><select id="llm-server"></select>
        <label class="ctl">方式</label><input id="llm-provider" readonly>
        <label class="ctl">URL</label><input id="llm-url" readonly>
        <label class="ctl">設定ファイル</label><code id="llm-config-path" class="muted"></code>
        <label class="ctl">タイムアウト</label><input id="llm-timeout" type="number" min="10" max="600" value="120">
        <button id="llm-connect">接続先を選択して保存</button>
      </div></details>
      <div class="llm-row"><label class="ctl">用途</label><select id="llm-purpose"><option value="quick">文章修正・補完</option><option value="diagram">図の生成・修正</option><option value="review">設計レビュー</option></select>
      <label class="ctl">モデル</label><select id="llm-model"></select>
      <label class="ctl">範囲</label><select id="llm-scope"><option value="selection">選択範囲</option><option value="section">現在の見出し</option><option value="smart">関連箇所を検索</option><option value="document">文書全体</option></select></div>
      <div class="llm-row compact"><label class="ctl">編集制限</label><select id="llm-policy"><option value="all">文章と図</option><option value="text">文章のみ（図を保護）</option><option value="diagram">図のみ（文章を保護）</option></select><button id="llm-history-open">変更履歴</button></div>
      <label class="ctl">依頼・質問</label>
      <textarea id="llm-instruction" placeholder="例: このシーケンス図を簡潔にして / この分岐が必要な理由は？"></textarea>
      <div class="llm-scope"><span id="llm-scope-label">文書全体を使用</span> · <span id="llm-token-estimate">約0 tokens</span></div>
      <div class="modal-actions"><button id="llm-close">閉じる</button><button id="llm-stop" class="danger hidden">生成停止</button><button id="llm-ask">理由を聞く</button><button id="llm-edit" class="accent">編集案を作る</button></div>
      <div id="llm-result" class="hidden"><div class="outline-title">回答 / 編集案 <span id="llm-validation"></span></div><pre id="llm-answer"></pre><div id="llm-diff" class="hidden"></div>
        <div id="llm-repair-note" class="muted"></div><div id="llm-apply-actions" class="modal-actions hidden"><label class="confirm-apply"><input id="llm-confirm" type="checkbox">差分と検証結果を確認しました</label><button id="llm-apply" class="primary" disabled>編集案を適用</button></div>
      </div>
      <div id="llm-history" class="hidden"><div class="outline-title">変更履歴</div><div id="llm-history-items"></div></div>
    </section>
  </div>

  <!-- 条件登録モーダル -->
  <div id="modal-backdrop" class="hidden">
    <div id="cond-modal">
      <div class="modal-title">条件を登録 <span id="cond-modal-dia" class="muted"></span></div>
      <label class="ctl">プリセット名</label>
      <input id="cond-name" type="text" placeholder="例: 認証エラー">
      <label class="ctl">条件式 <span class="muted">（例: error_count &gt; 0 &amp;&amp; role == "admin"）</span></label>
      <input id="cond-when" type="text" placeholder='空欄なら常に一致'>
      <label class="ctl">通るノード</label>
      <div id="cond-nodes" class="node-grid"></div>
      <div id="cond-error" class="badge danger" style="display:none"></div>
      <div class="modal-actions">
        <button id="cond-cancel">キャンセル</button>
        <button id="cond-submit" class="accent">登録</button>
      </div>
    </div>
  </div>

  <script src="/assets/vendor/markdown-it/markdown-it.min.js"></script>
  <script src="/assets/vendor/mermaid/mermaid.min.js"></script>
  <script src="/assets/vendor/monaco/vs/loader.js"></script>
  <script src="/assets/ui.js"></script>
</body>
</html>
