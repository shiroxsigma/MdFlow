<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>MdFlow</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="topbar">
    <span class="brand">🗺 MdFlow<small>仕様書・フローチャート統合</small></span>
    <span class="file-name" id="file-name">samples/login.md</span>
    <span class="spacer"></span>

    <label class="ctl">図</label>
    <select id="sel-diagram"></select>
    <label class="ctl">プリセット</label>
    <select id="sel-preset"></select>

    <button id="btn-open">開く</button>
    <button id="btn-save" class="primary">保存</button>
    <button id="btn-export" class="accent">PPTへ出力</button>
    <button id="btn-import">PPT取込</button>
  </div>

  <div id="main">
    <div id="left">
      <div class="pane-head">エディタ (Markdown)</div>
      <div id="editor-host">
        <textarea id="editor-fallback" spellcheck="false"></textarea>
      </div>
      <div id="cond-strip">
        <label class="ctl">条件 (JSON)</label>
        <textarea id="conditions">{"role": "admin", "error_count": 0}</textarea>
      </div>
    </div>
    <div id="divider"></div>
    <div id="right">
      <div class="pane-head">プレビュー</div>
      <div id="preview" class="md"></div>
    </div>
  </div>

  <div id="statusbar">
    <span id="status-preset" class="badge ok">プリセット: -</span>
    <span id="status-warn"></span>
    <span class="spacer" style="flex:1"></span>
    <span id="status-engine"></span>
  </div>
  <div id="toast"></div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vendor/markdown-it/markdown-it.min.js"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="ui.js"></script>
</body>
</html>
