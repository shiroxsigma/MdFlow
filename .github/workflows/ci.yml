name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    # MdFlow is distributed as a Windows desktop application. Keep the unit
    # suite on the target OS; the browser job below also covers Linux startup.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Run unit tests
        shell: pwsh
        run: |
          $output = python -m pytest tests --ignore=tests/e2e -q --junitxml=test-results/unit.xml 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $details = (($output | Select-Object -Last 40) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Unit test details::$details"
            exit $exitCode
          }
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/fetch_markdown_it.py
      - run: python scripts/fetch_mermaid.py
      - run: python scripts/fetch_monaco.py
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -q --browser chromium --tracing retain-on-failure
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
