name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Keep unit collection isolated from the Playwright conftest.  Some
      # pytest/plugin combinations still import nested conftest files while
      # walking a broadly specified tests directory.
      - run: pytest tests/test_*.py -q --junitxml=test-results/unit.xml
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/fetch_markdown_it.py
      - run: python scripts/fetch_mermaid.py
      - run: python scripts/fetch_monaco.py
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e -q --browser chromium --tracing retain-on-failure
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
